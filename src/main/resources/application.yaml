spring:
    servlet :
        multipart :
            maxFileSize : 10MB      # 파일 하나의 최대 크기
            maxRequestSize : 30MB   # 한 번에 최대 업로드 가능 용량
    devtools:
        livereload:
            enabled : true
        restart:
            enabled : true
    datasource:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://db.jjeovi.gabia.io:5432/dbjjeovi
        username: jjeovi
        password: ponkids2023!
    jpa:
        properties:
            hibernate:
                jdbc:
                    lob:
                        non_contextual_creation: 'true'
                default_schema : ponkids_dev
        hibernate:
            ddl-auto: none
    thymeleaf:
        cache : false
    profiles :
        active : local
    mvc:                                                                                                                                                                                                                   
      converters:
       preferred-json-mapper: gson
       
server:
    error:
        whitelabel:
            enabled : true
    servlet :
        session :
            persistent : false          # 재기동 해도 스프링 관련 세션 유지.
            timeout : 3600              # 세션 시간 (60분: 3600 )

#p6spy query logging
decorator:
    datasource:
        p6spy:
            enable-logging: true
            
