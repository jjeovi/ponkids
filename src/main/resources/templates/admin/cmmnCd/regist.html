<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/layout}">
<!-- S : Javascript functions	-->
<script layout:fragment="script">

    // DOM 준비 된 이후 실행
    $( function () {

    });

</script>
<!-- E : Javascript functions	-->
<th:block layout:fragment="content">
	
    <!-- S: content -->
    <div class="row">
        <div class="col-md-12 col-sm-12 ">
            <div class="x_panel">
                <div class="x_content">
                    <form id="insertForm" name="insertForm" method="post" th:action="@{ {basicPath}/mcd/insert ( basicPath = ${basicPath} ) }">
	                    <!-- hidden type  -->
                        <input type="hidden" name="clSn" />	 <!--  primary key -->

                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3  label-align">코드 이름<span class="required">*</span></label>
                            <div class="col-md-6 col-sm-6">
                                <input class="form-control" data-validate-length-range="2,50" name="cdNm" required="required" placeholder="코드 이름을 입력해주세요." />
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3  label-align">코드 설명<span class="required">*</span></label>
                            <div class="col-md-6 col-sm-6">
                                <input type="text" class="form-control" name="cdDc" required="required" placeholder="코드 설명을 입력해주세요." />
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3  label-align">코드 상세값 1 </label>
                            <div class="col-md-6 col-sm-6">
                                <input type="text" class="form-control" name="cdDetailVal1"  placeholder="코드 상세값 1 을(를) 입력해주세요." />
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3  label-align">코드 상세값 2 </label>
                            <div class="col-md-6 col-sm-6">
                                <input type="text" class="form-control" name="cdDetailVal2"  placeholder="코드 상세값 2 을(를) 입력해주세요." />
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3  label-align">코드 상세값 3 </label>
                            <div class="col-md-6 col-sm-6">
                                <input type="text" class="form-control" name="cdDetailVal3"  placeholder="코드 상세값 3 을(를) 입력해주세요." />
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3  label-align">코드 상세값 4 </label>
                            <div class="col-md-6 col-sm-6">
                                <input type="text" class="form-control" name="cdDetailVal4"  placeholder="코드 상세값 4 을(를) 입력해주세요." />
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3  label-align">코드 상세값 5 </label>
                            <div class="col-md-6 col-sm-6">
                                <input type="text" class="form-control" name="cdDetailVal5"  placeholder="코드 상세값 5 을(를) 입력해주세요." />
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3  label-align">분류 코드</label>
                            <div class="col-md-6 col-sm-6">
                                <input type="text" class="form-control" name="clCd"  placeholder="코드 상세값 5 을(를) 입력해주세요." />
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3  label-align">비고</label>
                            <div class="col-md-6 col-sm-6">
                                <textarea name="clCd"  class="form-control"></textarea>
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3 label-align">사용여부<span class="required">*</span></label>
                            <div class="col-md-2 col-sm-4">
                                <div class="btn-group radiobox">
                                    <input type="radio" id="useYn1" name="useYn" value="Y" class="join-btn">
                                    <label for="useYn1" class="btn btn-outline-purple w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">사용</label>
                                    <input type="radio" id="useYn2" name="useYn" value="N" class="join-btn">
                                    <label for="useYn2" class="btn btn-outline-purple w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">미사용</label>
                                </div>
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3 label-align">시스템 필수 코드 여부<span class="required">*</span></label>
                            <div class="col-md-2 col-sm-4">
                                <div class="btn-group radiobox">
                                    <input type="radio" id="sysEssntlCmmnYn1" name="sysEssntlCmmnYn" value="Y" class="join-btn">
                                    <label for="sysEssntlCmmnYn1" class="btn btn-outline-purple w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">예</label>
                                    <input type="radio" id="sysEssntlCmmnYn2" name="sysEssntlCmmnYn" value="N" class="join-btn">
                                    <label for="sysEssntlCmmnYn2" class="btn btn-outline-purple w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">아니오</label>
                                </div>
                            </div>
                        </div>
                        <div class="ln_solid"></div>
                        <!-- 저장버튼 -->
                        <div class="col-md-12">
                            <!-- bottom left area -->
                            <div class="col-md-2 col-sm-3 text-left">
                                <a th:href="@{ {basicPath}/{mcd}/list ( basicPath = ${basicPath}, mcd = ${mcd} ) }" class="btn btn-white w120p">목록</a>
                            </div>
                            <!-- bottom center area -->
                            <div class="col-md-8 col-sm-6 text-center">
                                <a th:href="@{ {basicPath}/{mcd}/list ( basicPath = ${basicPath}, mcd = ${mcd} ) }" class="btn btn-white w120p">취소</a>
                                <button type="submit" class="btn btn-purple w120p">저장</button>
                            </div>
                            <!-- bottom right area -->
                            <div class="col-md-2 col-sm-3 text-right">
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- E : content -->
</th:block>
</html>
