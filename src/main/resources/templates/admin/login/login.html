<script th:inline="javascript">

	/*<![CDATA[*/
	var errMsg = [[${errMsg}]];

	var sessionTime = [[${@environment.getProperty('server.servlet.session.timeout')}]];
	if( errMsg != null && errMsg != '')  {
		alert(errMsg);
	}
	function goLogin(){
		$("#loginForm").submit();
	}

	function readyLogin() {


		var form = $( "#loginForm" )[0];
		var formData = new FormData(form);

		var url = "/admin/readyLoginAjax"
		$.ajax({
			url: url,
			type: "POST",	// 회원저장 POST로
			async: false,	// 동기식 ajax : 통신이 완료될 떄 까지 다음 line 진행 안함
			data: formData, // 검색할 값
			async: false,
			cache: false,
			contentType : false,
			processData: false,
			success: function ( result ) {
				// return type : List<CategoryDto>

				if ( result.flag == "E" ) {
					alert(result.msg);

				} else if ( result.flag == "S" ) {
					// TODO : ajax 통신 이후 로직 ( 성공시 ) 구현

					// $( "#loginForm" ).submit();	// 로그인 구현
				}
			}
		});
	}
	/*]]>*/
</script>

<body class="login">
<div>
	<a class="hiddenanchor" id="signup"></a>
	<a class="hiddenanchor" id="signin"></a>

	<div class="login_wrapper">
		<div class="animate form login_form">
			<section class="login_content">
				<form id="loginForm" class="form-signin" th:action="@{/login}" method="post" onsubmit="return readyLogin();">
					<h1 class="login_title">피오니키즈 관리자</h1>
					<input type="hidden" name="returnUrlAfterLoginFail" value="/admLogin?auth=pon" />
					<div>
						<input type="text" class="form-control" name="username" placeholder="아이디 ( ex) admin@test.com )" required="" />
					</div>
					<div>
						<input type="password" class="form-control" name="password" placeholder="비밀번호" required="" />
					</div>
					<div>
						<a class="btn btn-default submit" href="javascript:;" onclick="goLogin();"> L O G I N </a>
					</div>
					<div class="clearfix"></div>
					<div class="separator">
						<p class="change_link">
							<a href="#signup" class="to_register"> 회원가입 및 계정찾기 </a>
						</p>
						<div class="clearfix"></div>
						<br />
						<div>
							<p><img class="logo_main" src="/pon/common/image/pioneerkids_logo_main.png" alt="피오니키즈 메인로고"></p>
							<p>©2024 All Rights Reserved. pioneerkids! is a meta developer template.</p>
						</div>
					</div>
				</form>
			</section>
		</div>

		<div id="register" class="animate form registration_form">
			<section class="login_content">
				<form>
					<h1 class="login_sub_title">회원가입</h1>
					<div class="sub_tab">
						<a class="login_tab active" href="index.html">회 원 가 입</a>
						<a class="login_tab" href="index.html">계 정 찾 기</a>
					</div><div>
					<input type="text" class="form-control" placeholder="Username" required="">
				</div>
					<div>
						<input type="email" class="form-control" placeholder="Email" required="">
					</div>
					<div>
						<input type="password" class="form-control" placeholder="Password" required="">
					</div>
					<div>
						<a class="btn btn-default submit" href="index.html">Submit</a>
					</div>

					<div class="clearfix"></div>

					<div class="separator">
						<p class="change_link">Already a member ?
							<a href="#signin" class="to_register"> Log in </a>
						</p>

						<div class="clearfix"></div>
						<br>

						<div>
							<h1><i class="fa fa-paw"></i> Gentelella Alela!</h1>
							<p>©2016 All Rights Reserved. Gentelella Alela! is a Bootstrap 4 template. Privacy and Terms</p>
						</div>
					</div>
				</form>
			</section>
		</div>
	</div>
</div>
