</div>

	<!-- 기존 답변 추가 -->
	<div class="replyList replyData">
		
	</div>
	
	<!-- 답변 추가 -->
	<div class="field item form-group manage">
		<label class="col-form-label col-md-2 col-sm-3 label-align">
			답변 작성

		<div class="col-form-label col-md-10 col-sm-6">
