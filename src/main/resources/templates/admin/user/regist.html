<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/layout}">
<!-- S : Javascript functions	-->
<script layout:fragment="script">
    var dupCheckFlag = false;   // 중복체크 변수 선언

    // DOM 준비 된 이후 실행
    $( function () {

        // initialize a validator instance from the "FormValidator" constructor.
        // A "<form>" element is optionally passed as an argument, but is not a must

        var validator = new FormValidator( {
            "events": [ 'blur', 'input', 'change' ]
        }, document.forms[0] );
        // on form "submit" event
        document.forms[0].onsubmit = function ( e ) { // 회원 등록시 유효성 검사.
            var submit = true,
                validatorResult = validator.checkAll( this );
            // console.log( validatorResult );

            // **  valid 추가 필요시 여기서

            // id 중복체크 여부 검사
            if ( !dupCheckFlag ) {
                alert( "아이디를 확인해주세요." );
                $( "#userId" ).focus();
                return false;
            }

            // 연락처 유효성 검사
            var telNo = $( "#telNo" ).val();
            if ( !isTelNoFormat( telNo ) ) {
                alert( "연락처 형태에 맞게 입력해주세요" );
                $( "#telNo" ).focus();
                return false;
            }

            // 거주지역 그 외만 선택 했을 시 return false;
            var resideArea = $( "input:radio[name='resideArea']:checked" ).val();
            var country = $( "#countryList" ).val();
            if ( resideArea == 'other' ) {
                if ( country == '' ) {
                    alert( "거주지역을 선택해주세요." );
                    $( "#countryList" ).focus();
                    return false;
                } else {
                    $( "[name='resideArea']" ).val( country );
                }

            }

            // 권한이 관리자일때, 권한 선택 안되어있을 때 return false
            var mngrYn = $( "[name='mngrYn']:checked" ).val();
            var roleSn = $( "[name='roleSn']" ).val();
            if ( mngrYn == 'Y' && roleSn == '' ) {
                alert( "관리자 권한을 선택해 주세요." );
                $( "#roleList" ).focus();
                return false;
            }

            // ==================== 유효성 모두 통과 후 dataset 정리 ==================================
            // ==================== 유효성 모두 통과 후 dataset 정리 ==================================

            // 거주지역 set
            if ( resideArea == 'other' ) {
                $( "[name='resideArea']" ).val( country );
            }

            // 자녀정보 배열 처리 :
            // 자녀정보들 각각 값들을 배열화시켜 submit
            // div name : chldrnAddDiv / newForm 이 아닌 div 를 배열로 정리
            $( "[name='chldrnAddDiv']" ).not( '.newForm' ).each( function ( index ) {
                // 자녀이름, 자녀성별, 자녀생년월일, 자녀이메일, 자녀연락처
                $( this ).find( "[name=chldrnNm]" ).attr( "name", "userChldrns[" + index + "].chldrnNm" );					// 자녀 이름
                $( this ).find( "[name=chldrnGender]" ).attr( "name", "userChldrns[" + index + "].chldrnGender" );			// 자녀 성별
                $( this ).find( "[name=chldrnBrdtDate]" ).attr( "name", "userChldrns[" + index + "].chldrnBrdtDate" );		// 자녀 생년월일
                $( this ).find( "[name=chldrnEmail]" ).attr( "name", "userChldrns[" + index + "].chldrnEmail" );			// 자녀 이메일
                $( this ).find( "[name=chldrnTelNo]" ).attr( "name", "userChldrns[" + index + "].chldrnTelNo" );			// 자녀 연락처
                $( this ).find( "[name=file]" ).attr( "name", "userChldrns[" + index + "].file" );							// 파일

            } );

            // return false;
            return !!validatorResult.valid;
        };

        // on form "reset" event
        document.forms[0].onreset = function ( e ) {
            validator.reset();
        };
        // stuff related ONLY for this demo page:
        $( '.toggleValidationTooltips' ).change( function () {
            validator.settings.alerts = !this.checked;
            if ( this.checked )
                $( 'form .alert' ).remove();
        } ).prop( 'checked', false );


        // 거주지역 변동시 셀렉트박스 표출 처리
        $( "input:radio[name='resideArea']" ).change( function () {

            // 그 외 거주지역 선택시 나라 선택하도록 setting
            var country = $( this ).val();

            if ( country == 'other' ) {
                $( "#countryList" ).show();
            } else {
                $( "#countryList" ).hide();
            }
        } );

        // 관리자 여부 변동시 셀렉트박스 표출 처리
        $( "input:radio[name='mngrYn']" ).change( function () {

            // 관리자 로 선택시 권한 상세 선택하도록 setting
            var mngrYn = $( this ).val();

            if ( mngrYn == 'Y' ) {
                // 권한 상세 선택 보이고, 자녀 추가 영역 가림
                $( "#roleList" ).show();
                $( "#userChldrnAddDiv" ).hide();
            } else {
                // 권한 상세 선택 가리고, 자녀 추가 영역 보임
                $( "#roleList" ).hide();
                $( "#userChldrnAddDiv" ).show();
            }
        } );

        // 아이디 입력 focusout 처리 ( 중복체크 로직 )
        $( "#userId" ).focusout( function () {
            dupCheckFlag = false;
            var userId = $( "#userId" ).val();      // userId값 넘기기

            if ( validId( userId ) ) {

                $.ajax( {
                    url: "/live/idDupCheck",
                    type: "GET",
                    dataType: "json",
                    data: { userId: userId },
                    contentType: "application/json",
                    success: function ( result ) {
                        if ( !result ) dupCheckFlag = true;
                        idDupResult( dupCheckFlag, "checkResult" );
                    }
                } );
            } else {
                idDupResult( dupCheckFlag, "checkResult" );
            }
        } )
    } );

    // 비밀번호 보이기 함수
    function hideshow() {
        var password = document.getElementById( "password1" );
        var slash = document.getElementById( "slash" );
        var eye = document.getElementById( "eye" );

        if ( password.type === 'password' ) {
            password.type = "text";
            slash.style.display = "block";
            eye.style.display = "none";
        } else {
            password.type = "password";
            slash.style.display = "none";
            eye.style.display = "block";
        }
    }

    // 자녀 추가 버튼 클릭
    function addChldrn() {
        // target 자녀 div
        var $targetChldrnDiv = $( "[name='chldrnAddDiv'].newForm" );

        // 이름, 성별 유효성 검사
        if ( !chldrnValidCheck( $targetChldrnDiv ) ) return false;

        // 성별 (라디오) 값 hidden 태그에 저장
        $targetChldrnDiv.find( "[name='chldrnGender']" ).val( $targetChldrnDiv.find( "[name='chldrnGenderRadio']:checked" ).val() );

        // 신규자녀정보를 chldrnTable 테이블에 표시 한 뒤  새로운 chldrnAddDiv 생성
        addChldrnRow( $targetChldrnDiv );    // 자녀정보테이블에추가

        // 모든 chldrnAddDiv newForm 제거
        $( "[name='chldrnAddDiv']" ).removeClass( "newForm" );
        // 모든 chldrnAddDiv 숨기기
        $( "[name='chldrnAddDiv']" ).hide();

        // 새로운 폼 추가
        var $newChldrnForm = $( "<div name='chldrnAddDiv' class='newForm'>" ).load( "/admin/user/addChldrnFormModal.html" );
        $( "#addChldrnModalBody" ).append( $newChldrnForm );

        // 모달창 닫기
        $( "#addChldrnModal" ).modal( 'hide' );
        return true;
    }

    // 자녀 수정 버튼 클릭 > 수정정보 tr에 현행화
    function updateChldrn() {

        // target 자녀 div setting
        var $targetChldrnDiv = $( "[name='chldrnModDiv']" );

        // 이름, 성별 유효성 검사
        if ( !chldrnValidCheck( $targetChldrnDiv ) ) return false;

        // 성별 (라디오) 값 hidden 태그에 저장
        $targetChldrnDiv.find( "[name='chldrnGender']" ).val( $targetChldrnDiv.find( "[name='chldrnGenderRadio']:checked" ).val() );


        // S : trNum 번째 찾기
        var $trNumDiv = $( "[name='chldrnAddDiv'].modifyForm" );
        var trNum = $trNumDiv.prevAll().length - 1;
        // E : trNum 번째 찾기

        // 자녀정보 테이블의 trNum 번째 자녀에 수정한 값을 매핑하여표시하기
        modifyChldrnRow( $targetChldrnDiv, trNum );    // 자녀정보테이블에추가

        // modifyForm 내용을 targetChldrnDiv 내용으로 교체
        var $cloneDiv = $targetChldrnDiv.clone();
        $cloneDiv = $cloneDiv.contents().unwrap();
        $trNumDiv.empty();
        $cloneDiv.appendTo( $trNumDiv );

        // targetChldrnDiv 안의 내용 지우기
        $targetChldrnDiv.empty();

        // 모든 chldrnAddDiv modifyForm 제거
        $( "[name='chldrnAddDiv']" ).removeClass( "modifyForm" );

        // 모달창 닫기
        $( "#addChldrnModal" ).modal( 'hide' );

        return true;

    }

    // 자녀 정보 테이블에 add
    function addChldrnRow( $targetChldrnDiv ) {
        // $("#chldrnTableBody tr").length  // 현재 테이블 tr 개수

        // 추가
        $( "#chldrnTableBody" ).append(
            $( "<tr>" ).append(
                $( "<td>" ).attr( "name", "trNum" ).append( $( "#chldrnTableBody tr" ).length + 1 ),                    // 순번
                $( "<td>" ).attr( "name", "chldrnNm" ).append( $targetChldrnDiv.find( "[name='chldrnNm']" ).val() ),        // 이름
                $( "<td>" ).attr( "name", "chldrnGenderRadio" ).append( $targetChldrnDiv.find( "[name='chldrnGenderRadio']:checked" ).val() == "M" ? "남자" : "여자" ),    // 성별
                $( "<td>" ).attr( "name", "chldrnBrdtDate" ).append( $targetChldrnDiv.find( "[name='chldrnBrdtDate']" ).val() ),  // 생년월일
                $( "<td>" ).attr( "name", "chldrnTelNo" ).append( $targetChldrnDiv.find( "[name='chldrnTelNo']" ).val() ),     // 연락처
                $( "<td>" ).attr( "name", "chldrnEmail" ).append( $targetChldrnDiv.find( "[name='chldrnEmail']" ).val() ),     // 이메일
                $( "<td>" ).append(                                                         // 관리
                    $( "<button>" ).attr( "onclick", "modifyChldrn(this)" ).attr( "type", "button" ).addClass( "btn btn-success btn-sm table-btn" ).append( "수정" ),
                    $( "<button>" ).attr( "onclick", "deleteChldrn(this)" ).attr( "type", "button" ).addClass( "btn btn-danger btn-sm table-btn" ).append( "삭제" )
                )
            )
        );
    }

    // 자녀 정보 테이블에 add
    function modifyChldrnRow( $targetChldrnDiv, trNum ) {

        $modifyTr = $( "#chldrnTableBody tr" ).eq( trNum );

        $modifyTr.find( "[name='chldrnNm']" ).text( $targetChldrnDiv.find( "[name='chldrnNm']" ).val() );
        $modifyTr.find( "[name='chldrnGenderRadio']" ).text( $targetChldrnDiv.find( "[name='chldrnGenderRadio']:checked" ).val() == "M" ? "남자" : "여자" );
        $modifyTr.find( "[name='chldrnBrdtDate']" ).text( $targetChldrnDiv.find( "[name='chldrnBrdtDate']" ).val() );
        $modifyTr.find( "[name='chldrnTelNo']" ).text( $targetChldrnDiv.find( "[name='chldrnTelNo']" ).val() );
        $modifyTr.find( "[name='chldrnEmail']" ).text( $targetChldrnDiv.find( "[name='chldrnEmail']" ).val() );

    }

    // 자녀 form 유효성 검사
    function chldrnValidCheck( $targetChldrnDiv ) {

        var chldrnNm = $targetChldrnDiv.find( "[name='chldrnNm']" ).val();
        var chldrnGenderRadio = $targetChldrnDiv.find( "[name='chldrnGenderRadio']:checked" ).val();

        if ( !validCheckName( chldrnNm ) ) {
            return false;
        } else if ( chldrnGenderRadio == null || chldrnGenderRadio == '' ) {
            alert( "자녀 성별을 선택해주세요." );
            return false;
        }

        return true;

    }

    // 자녀 수정 버튼 > modal 출력
    function modifyChldrn( e ) {
        // 모달 하단의 버튼 설정
        setModalBtn( "U" );

        // 햔재 선택된 자녀의 number 체크 후(trNum)
        // trNum 번째 찾기 setting
        var trNum = $( e ).closest( 'tr' ).prevAll().length;

        // [name='chldrnModDiv'] div empty
        $( "[name='chldrnModDiv']" ).empty();

        // contents().unwrap() : 하위항목들만 남기고 최상위태그 제거 ( 자식 요소를 그대로 둔 채 현재 태그를 제거 )
        // $( "[name='chldrnAddDiv']" ).eq( trNum ).contents().unwrap().clone().appendTo("[name='chldrnModDiv']");
        var $cloneDiv = $( "[name='chldrnAddDiv']" ).eq( trNum ).clone();
        $cloneDiv = $cloneDiv.contents().unwrap();

        $cloneDiv.appendTo( "[name='chldrnModDiv']" );
        // 모든 chldrnAddDiv 숨기기
        $( "[name='chldrnAddDiv']" ).hide();
        // chldrnModDiv show
        $( "[name='chldrnModDiv']" ).show();

        // 모든 chldrnAddDiv 에 modifyForm class 제거 후, trNum 번째에만 modifyForm class 추가
        $( "[name='chldrnAddDiv']" ).removeClass( "modifyForm" );
        $( "[name='chldrnAddDiv']" ).eq( trNum ).addClass( "modifyForm" );

        // 현재 선택한 라디오버튼 강제로 값 checked 처리 (안해주면 checked 처리가 풀려있음).
        // 남자 = M 여자 = F
        var chldrnGenderRadioVal = $( e ).parent().siblings( "[name='chldrnGenderRadio']" ).text() == "남자" ? "M" : "F";
        if ( chldrnGenderRadioVal == "M" ) {
            $( "[name='chldrnModDiv']" ).find( "[name='chldrnGenderRadio'][value='M']" ).prop( "checked", true );
        } else if ( chldrnGenderRadioVal == "F" ) {
            $( "[name='chldrnModDiv']" ).find( "[name='chldrnGenderRadio'][value='F']" ).prop( "checked", true );
        }

        $( "#addChldrnModal" ).modal( 'show' );

    }

    // 자녀 삭제 버튼
    function deleteChldrn( e ) {
        if ( confirm( "해당 자녀를 삭제합니다." ) ) {
            // 몇번째 테이블인지 체크
            var trNum = $( e ).closest( 'tr' ).prevAll().length;

            // 테이블의 tr 과 모달의 trNum 번째 div 2가지를 remove 한다.
            // - 테이블 tr remove
            $( e ).parent().parent().remove();
            // - 모달의 trNum 번째 div remove
            $( "[name='chldrnAddDiv']" ).eq( trNum ).remove();

            $( '#chldrnTable tr' ).each( function () {
                $( this ).find( "[name='trNum']" ).text( ( $( this ).prevAll().length ) + 1 );
            } );
        }

    }

    // 모달 버튼 setting
    function setModalBtn( mode ) {

        // mode : C, U
        // C : 등록 (create)
        // U : 수정 (update)

        if ( mode == "C" ) {
            // 모달창의 수정 버튼 숨기고 저장 버튼을 표시
            $( "#addChldrnBtn" ).show();
            $( "#updateChldrnBtn" ).hide();

            // chldrnAddDiv newForm show
            $( "[name='chldrnAddDiv'].newForm" ).show();
            // chldrnModDiv hide
            $( "[name='chldrnModDiv']" ).hide();

        } else if ( mode == "U" ) {
            // 모달창의 저장 버튼 숨기고 수정 버튼을 표시
            $( "#addChldrnBtn" ).hide();
            $( "#updateChldrnBtn" ).show();

            // chldrnModDiv show
            $( "[name='chldrnModDiv']" ).show();
            // chldrnAddDiv newForm hide
            $( "[name='chldrnAddDiv'].newForm" ).hide();
        }
    }


</script>

            <div class="x_panel">

                            </div>
                        </div>

                            </div>
                        </div>

                            <label class="col-form-label col-md-2 col-sm-3 label-align">이름<span class="required">*</span></label>

                                    최소 2자 이상, 10자 이하로 입력해주세요.

                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3 label-align">성별<span class="required">*</span></label>

                                    <label for="gender1" class="btn btn-outline-purple w100p"

                                           data-toggle-passive-class="btn-default">남자</label>
                                    <input type="radio" id="gender2" name="gender" value="F" class="join-btn" required>
                                    <label for="gender2" class="btn btn-outline-purple w100p"

                                           data-toggle-passive-class="btn-default">여자</label>
                                </div>
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3 label-align">생년월일<span class="required">*</span></label>
                            <div class="col-md-6 col-sm-6">
