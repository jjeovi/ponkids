<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<title layout:fragment="title">pioneerkids Admin - 회원 등록</title>
<!-- S : Javascript functions	-->
<script layout:fragment="script">

    // DOM 준비 된 이후 실행
    $( function () {

        // initialize a validator instance from the "FormValidator" constructor.
        // A "<form>" element is optionally passed as an argument, but is not a must

        var validator = new FormValidator( {
            "events": [ 'blur', 'input', 'change' ]
        }, document.forms[0] );
        // on form "submit" event
        document.forms[0].onsubmit = function ( e ) { // 회원 등록시 유효성 검사.
            var submit = true,
                validatorResult = validator.checkAll( this );
            // console.log( validatorResult );

            // **  valid 추가 필요시 여기서


            // 연락처 유효성 검사
            var telNo = $( "#telNo" ).val();
            if ( !isTelNoFormat( telNo ) ) {
                alert( "연락처 형태에 맞게 입력해주세요" );
                $( "#telNo" ).focus();
                return false;
            }

            // 거주지역 그 외만 선택 했을 시 return false;
            var resideArea = $( "input:radio[name='resideArea']:checked" ).val();
            var country = $( "#countryList" ).val();
            if ( resideArea == 'other' ) {
                if ( country == '' ) {
                    alert( "거주지역을 선택해주세요." );
                    $( "#countryList" ).focus();
                    return false;
                } else {
                    $( "[name='resideArea']" ).val( country );
                }

            }

            // 권한이 관리자일때, 권한 선택 안되어있을 때 return false
            var mngrYn = $( "[name='mngrYn']:checked" ).val();
            var roleSn = $( "[name='roleSn']" ).val();
            if ( mngrYn == 'Y' && roleSn == '' ) {
                alert( "관리자 권한을 선택해 주세요." );
                $( "#roleList" ).focus();
                return false;
            }

            // ==================== 유효성 모두 통과 후 dataset 정리 ==================================
            // ==================== 유효성 모두 통과 후 dataset 정리 ==================================

            // 거주지역 set
            if ( resideArea == 'other' ) {
                $( "[name='resideArea']" ).val( country );
            }

            // 자녀정보 배열 처리 :
            // 자녀정보들 각각 값들을 배열화시켜 submit
            // div name : chldrnAddDiv / newForm 이 아닌 div 를 배열로 정리
            $("[name='chldrnAddDiv']").not('.newForm').each( function (index) {
                // 첨부파일, userSn, 자녀순번, 자녀이름, 자녀성별, 자녀생년월일, 자녀이메일, 자녀연락처
                $(this).find("input[name=atchFileSn]"		).attr("name", "userChldrns[" + index + "].atchFileSn");
                $(this).find("input[name=userSn]"			).attr("name", "userChldrns[" + index + "].userSn");
                $(this).find("input[name=userChldrnSeq]"	).attr("name", "userChldrns[" + index + "].userChldrnSeq");
                $(this).find("input[name=chldrnNm]"			).attr("name", "userChldrns[" + index + "].chldrnNm");
                $(this).find("input[name=chldrnGender]"		).attr("name", "userChldrns[" + index + "].chldrnGender");
                $(this).find("input[name=chldrnBrdtDate]"	).attr("name", "userChldrns[" + index + "].chldrnBrdtDate");
                $(this).find("input[name=chldrnEmail]"		).attr("name", "userChldrns[" + index + "].chldrnEmail");
                $(this).find("input[name=chldrnTelNo]"		).attr("name", "userChldrns[" + index + "].chldrnTelNo");
                $(this).find("input[name=file]"				).attr("name", "userChldrns[" + index + "].file");
                
            });


//             return false;
            return !!validatorResult.valid;

        };

        // on form "reset" event
        document.forms[0].onreset = function ( e ) {
            validator.reset();
        };
        // stuff related ONLY for this demo page:
        $( '.toggleValidationTooltips' ).change( function () {
            validator.settings.alerts = !this.checked;
            if ( this.checked )
                $( 'form .alert' ).remove();
        } ).prop( 'checked', false );


        // 거주지역 변동시 셀렉트박스 표출 처리
        $( "input:radio[name='resideArea']" ).change( function () {

            // 그 외 거주지역 선택시 나라 선택하도록 setting
            var country = $( this ).val();

            if ( country == 'other' ) {
                $( "#countryList" ).show();
            } else {
                $( "#countryList" ).hide();
            }
        } );

        // 관리자 여부 변동시 셀렉트박스 표출 처리
        $( "input:radio[name='mngrYn']" ).change( function () {
        
             // 관리자 로 선택시 권한 상세 선택하도록 setting
            var mngrYn = $( this ).val();
        
            if ( mngrYn == 'Y' ) {
                // 권한 상세 선택 보이고, 자녀 추가 영역 가림
                $( "#roleList" ).show();
                $("#userChldrnAddDiv").hide();
            } else {
                // 권한 상세 선택 가리고, 자녀 추가 영역 보임
                $( "#roleList" ).hide();
                $("#userChldrnAddDiv").show();
            }
        } );
        
        
        var country = $("[name='resideArea']:checked").val();
        if ( country == 'other' ) {
            $( "#countryList" ).show();
        } else {
            $( "#countryList" ).hide();
        }
        
        var mngrYn = $("[name='mngrYn']:checked").val();
        if ( mngrYn == 'Y' ) {
            // 권한 상세 선택 보이고, 자녀 추가 영역 가림
            $( "#roleList" ).show();
            $("#userChldrnAddDiv").hide();
        } else {
            // 권한 상세 선택 가리고, 자녀 추가 영역 보임
            $( "#roleList" ).hide();
            $("#userChldrnAddDiv").show();
        }

    } );

 // 자녀 추가 버튼 클릭
    function addChldrn() {
        // target 자녀 div
        var $targetChldrnDiv = $( "[name='chldrnAddDiv'].newForm" );

        // 이름, 성별 유효성 검사
        if ( !chldrnValidCheck( $targetChldrnDiv ) ) return false;

        // 성별 (라디오) 값 hidden 태그에 저장
        $targetChldrnDiv.find("[name='chldrnGender']").val($targetChldrnDiv.find("[name='chldrnGenderRadio']:checked").val());

        // 신규자녀정보를 chldrnTable 테이블에 표시 한 뒤  새로운 chldrnAddDiv 생성
        addChldrnRow( $targetChldrnDiv );    // 자녀정보테이블에추가

        // 모든 chldrnAddDiv newForm 제거
        $( "[name='chldrnAddDiv']" ).removeClass( "newForm" );
        // 모든 chldrnAddDiv 숨기기
        $( "[name='chldrnAddDiv']" ).hide();

        // 새로운 폼 추가
        var $newChldrnForm = $( "<div name='chldrnAddDiv' class='newForm'>" ).load( "/admin/user/addChldrnForm.html" );
        $( "#addChldrnModalBody" ).append( $newChldrnForm );

        // 모달창 닫기
        $( "#addChldrnModal" ).modal( 'hide' );
        return true;
    }

    // 자녀 수정 버튼 클릭 > 수정정보 tr에 현행화
    function updateChldrn() {
    	
    	// target 자녀 div setting
		var $targetChldrnDiv = $( "[name='chldrnModDiv']" );
    	
		// 이름, 성별 유효성 검사
		if ( !chldrnValidCheck( $targetChldrnDiv ) ) return false;
		
		// 성별 (라디오) 값 hidden 태그에 저장
		$targetChldrnDiv.find("[name='chldrnGender']").val($targetChldrnDiv.find("[name='chldrnGenderRadio']:checked").val());
		
		
		// S : trNum 번째 찾기 
		var $trNumDiv = $( "[name='chldrnAddDiv'].modifyForm" );
		var trNum = $trNumDiv.prevAll().length -1;
		// E : trNum 번째 찾기
		
		// 자녀정보 테이블의 trNum 번째 자녀에 수정한 값을 매핑하여표시하기
     	modifyChldrnRow( $targetChldrnDiv, trNum );    // 자녀정보테이블에추가
     	
     	// modifyForm 내용을 targetChldrnDiv 내용으로 교체
     	var $cloneDiv = $targetChldrnDiv.clone();
     	$cloneDiv = $cloneDiv.contents().unwrap();
     	$trNumDiv.empty();
     	$cloneDiv.appendTo($trNumDiv);
     	
     	// targetChldrnDiv 안의 내용 지우기
     	$targetChldrnDiv.empty();
     	
     	// 모든 chldrnAddDiv modifyForm 제거
		$( "[name='chldrnAddDiv']" ).removeClass( "modifyForm" );
    	
     	// 모달창 닫기
     	$( "#addChldrnModal" ).modal( 'hide' );
       
    	
//     	// target 자녀 div
//         var $targetChldrnDiv = $( "[name='chldrnAddDiv'].modifyForm" );

//         // 이름, 성별 유효성 검사
//         if ( !chldrnValidCheck( $targetChldrnDiv ) ) return false;

//         // 성별 (라디오) 값 hidden 태그에 저장
//         $targetChldrnDiv.find("[name='chldrnGender']").val($targetChldrnDiv.find("[name='chldrnGenderRadio']:checked").val());

//         // trNum 번째 chldrn 정보를 수정
//         modifyChldrnRow( $targetChldrnDiv );    // 자녀정보테이블에추가

//         // 모든 chldrnAddDiv newForm 제거
//         $( "[name='chldrnAddDiv']" ).removeClass( "modifyForm" );
//         // 모든 chldrnAddDiv 숨기기
//         $( "[name='chldrnAddDiv']" ).hide();
//         // 신규 추가 모달 show
//         $( "[name='chldrnAddDiv'].newForm" ).show();

//         // 모달창 닫기
//         $( "#addChldrnModal" ).modal( 'hide' );
        return true;

    }

    // 자녀 정보 테이블에 add
    function addChldrnRow( $targetChldrnDiv ) {
        // $("#chldrnTableBody tr").length  // 현재 테이블 tr 개수

        // 추가
        $( "#chldrnTableBody" ).append(
            $( "<tr>" ).append(
                $( "<td>" ).attr( "name", "trNum" ).append( $( "#chldrnTableBody tr" ).length + 1 ),                    // 순번
                $( "<td>" ).attr( "name", "chldrnNm" ).append( $targetChldrnDiv.find( "[name='chldrnNm']" ).val() ),        // 이름
                $( "<td>" ).attr( "name", "chldrnGenderRadio" ).append( $targetChldrnDiv.find( "[name='chldrnGenderRadio']:checked" ).val() == "M" ? "남자" : "여자" ),    // 성별
                $( "<td>" ).attr( "name", "chldrnBrdtDate" ).append( $targetChldrnDiv.find( "[name='chldrnBrdtDate']" ).val() ),  // 생년월일
                $( "<td>" ).attr( "name", "chldrnTelNo" ).append( $targetChldrnDiv.find( "[name='chldrnTelNo']" ).val() ),     // 연락처
                $( "<td>" ).attr( "name", "chldrnEmail" ).append( $targetChldrnDiv.find( "[name='chldrnEmail']" ).val() ),     // 이메일
                $( "<td>" ).append(                                                         // 관리
                    $( "<button>" ).attr( "onclick", "modifyChldrn(this)" ).attr("type","button").addClass( "btn btn-success btn-sm table-btn" ).append( "수정" ),
                    $( "<button>" ).attr( "onclick", "deleteChldrn(this)" ).attr("type","button").addClass( "btn btn-danger btn-sm table-btn" ).append( "삭제" )
                )
            )
        );
    }
    

    // 자녀 정보 테이블에 add
    function modifyChldrnRow( $targetChldrnDiv, trNum ) {

        $modifyTr = $( "#chldrnTableBody tr" ).eq( trNum );

        $modifyTr.find( "[name='chldrnNm']" ).text( $targetChldrnDiv.find( "[name='chldrnNm']" ).val() );
        $modifyTr.find( "[name='chldrnGenderRadio']" ).text( $targetChldrnDiv.find( "[name='chldrnGenderRadio']:checked" ).val() == "M" ? "남자" : "여자" );
        $modifyTr.find( "[name='chldrnBrdtDate']" ).text( $targetChldrnDiv.find( "[name='chldrnBrdtDate']" ).val() );
        $modifyTr.find( "[name='chldrnTelNo']" ).text( $targetChldrnDiv.find( "[name='chldrnTelNo']" ).val() );
        $modifyTr.find( "[name='chldrnEmail']" ).text( $targetChldrnDiv.find( "[name='chldrnEmail']" ).val() );

    }

    // 자녀 form 유효성 검사
    function chldrnValidCheck( $targetChldrnDiv ) {

        var chldrnNm = $targetChldrnDiv.find( "[name='chldrnNm']" ).val();
        var chldrnGenderRadio = $targetChldrnDiv.find( "[name='chldrnGenderRadio']:checked" ).val();

        if ( !validCheckName( chldrnNm ) ) {
            return false;
        } else if ( chldrnGenderRadio == null || chldrnGenderRadio == '' ) {
            alert( "자녀 성별을 선택해주세요." );
            return false;
        }

        return true;

    }

    // 자녀 수정 버튼 > modal 출력
    function modifyChldrn( e ) {
        // 모달 하단의 버튼 설정
        setModalBtn( "U" );

        // 햔재 선택된 자녀의 number 체크 후(trNum)
        // trNum 번째 chldrnAddDiv 를 show
        var trNum = $( e ).closest( 'tr' ).prevAll().length;

        // [name='chldrnModDiv'] div empty
        $("[name='chldrnModDiv']").empty();

        // contents().unwrap() : 하위항목들만 남기고 최상위태그 제거 ( 자식 요소를 그대로 둔 채 현재 태그를 제거 )
//         $( "[name='chldrnAddDiv']" ).eq( trNum ).contents().unwrap().clone().appendTo("[name='chldrnModDiv']");
        var $cloneDiv = $( "[name='chldrnAddDiv']" ).eq( trNum ).clone();
        $cloneDiv = $cloneDiv.contents().unwrap();
        
        $cloneDiv.appendTo("[name='chldrnModDiv']");
	    // 모든 chldrnAddDiv 숨기기
		$( "[name='chldrnAddDiv']" ).hide();
		// chldrnModDiv show
     	$( "[name='chldrnModDiv']" ).show();
		
		// 모든 chldrnAddDiv 에 modifyForm class 제거 후, trNum 번째에만 modifyForm class 추가
		$( "[name='chldrnAddDiv']" ).removeClass( "modifyForm" );
		$( "[name='chldrnAddDiv']" ).eq( trNum ).addClass( "modifyForm" );
        
        // 현재 선택한 라디오버튼 강제로 값 checked 처리 (안해주면 checked 처리가 풀려있음).
        // 남자 = M 여자 = F
        var chldrnGenderRadioVal = $( e ).parent().siblings( "[name='chldrnGenderRadio']" ).text() == "남자" ? "M" : "F";
        if ( chldrnGenderRadioVal == "M" ) {
            $( "[name='chldrnModDiv']" ).find( "[name='chldrnGenderRadio'][value='M']" ).prop( "checked", true );
            $( "[name='chldrnModDiv']" ).find( "[name='chldrnGenderRadio'][value='M']" ).trigger("click");
        } else if ( chldrnGenderRadioVal == "F" ) {
            $( "[name='chldrnModDiv']" ).find( "[name='chldrnGenderRadio'][value='F']" ).prop( "checked", true );
            $( "[name='chldrnModDiv']" ).find( "[name='chldrnGenderRadio'][value='F']" ).trigger("click");
        }
        
        
        $( "#addChldrnModal" ).modal( 'show' );
    }

    // 자녀 삭제 버튼
    function deleteChldrn( e ) {
        if ( confirm( "해당 자녀를 삭제합니다." ) ) {
            // 몇번째 테이블인지 체크
            var trNum = $( e ).closest( 'tr' ).prevAll().length;

            // 테이블의 tr 과 모달의 trNum 번째 div 2가지를 remove 한다.
            // - 테이블 tr remove
            $( e ).parent().parent().remove();
            // - 모달의 trNum 번째 div remove
            $( "[name='chldrnAddDiv']" ).eq( trNum ).remove();

            $( '#chldrnTable tr' ).each( function () {
                $( this ).find( "[name='trNum']" ).text( ( $( this ).prevAll().length ) + 1 );
            } );
        }

    }

    // 모달 버튼 setting
    function setModalBtn( mode ) {
        if ( mode == "C" ) {
            // 모달창의 수정 버튼 숨기고 저장 버튼을 표시
            $( "#addChldrnBtn" ).show();
            $( "#updateChldrnBtn" ).hide();

        } else if ( mode == "U" ) {
            // 모달창의 저장 버튼 숨기고 수정 버튼을 표시
            $( "#addChldrnBtn" ).hide();
            $( "#updateChldrnBtn" ).show();
        }
    }

</script>

                                    <label for="gender1" class="btn btn-outline-purple w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">남자</label>
                                    <input type="radio" id="gender2" name="gender" value="F" class="join-btn" th:checked="${targetDto.gender eq 'F'}" required>
                                    <label for="gender2" class="btn btn-outline-purple w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">여자</label>
                                </div>
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3 label-align"><span class="required">*</span>생년월일</label>
                            <div class="col-md-6 col-sm-6">
                                <input class="form-control Date8String" type="date" name="brdtDate" required="required" th:value="${targetDto.brdtDate}">
                                <small class="font-gray-dark">
                                    아이디 찾기 시 생년월일을 입력합니다.
                                </small>
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3 label-align"><span class="required">*</span>연락처</label>
                            <div class="col-md-6 col-sm-6">
                                <input class="form-control" type="tel" name="telNo" id="telNo" th:value="${targetDto.telNo}" required="required" placeholder="연락처입력 ( - 제외 )" data-validate-length-range="10,11" >
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3 label-align"><span class="required">*</span>거주지역</label>
                            <div class="col-md-2 col-sm-4">
                                <div class="btn-group radiobox">
                                    <input type="radio" id="resideArea1" name="resideArea" value="대한민국" class="join-btn" th:checked="${targetDto.resideArea eq '대한민국'}" required="required">
                                    <label for="resideArea1" class="btn btn-outline-purple w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">대한민국</label>
                                    <input type="radio" id="resideArea2" name="resideArea" value="other" class="join-btn" th:checked="${targetDto.resideArea ne '대한민국'}" required="required">
                                    <label for="resideArea2" class="btn btn-outline-purple w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">
                                    	그 외
                                    </label>
                                </div>
                            </div>
                            <!-- TODO 공통코드로 불러서 뿌리게끔 수정 -->
                            <div class="col-md-2 col-sm-4">
                            	<select class="form-control" name="otherResideArea" id="countryList" style="display: none;">
                                    <option value="">국가 선택</option>
                                    <option th:each="item : ${resideAreaList}" th:value="${item.cdDetailVal1}" th:selected="${item.cdDetailVal1} == ${targetDto.resideArea}" th:text="${item.cdDetailNm}">
                                </select>
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3 label-align">주소</label>
                            <div class="col-md-1 col-sm-6">
                                <input class="form-control text-center" type="text" name="zip" readonly
                                       placeholder="우편번호"/>
                            </div>
                            <div class="col-md-5 col-sm-6 pl-0">
                                <input class="form-control" type="text" name="rdnmAdr" th:readonly="readonly"
                                       placeholder="주소 찾기 버튼 클릭하여 주소 입력"/>
                            </div>
                            <div class="col-md-1 pl-0">
                                <button type="button" class="btn btn-purple w100p">주소 찾기</button>
                            </div>
                        </div>
                        <div class="field item form-group">
                            <label class="col-form-label col-md-2 col-sm-3 label-align"><span class="required">*</span>관리자 여부</label>
                            <div class="col-md-2 col-sm-4">
                                <div class="btn-group radiobox">
                                    <input type="radio" id="mngrYn1" name="mngrYn" value="N" th:checked="${targetDto.mngrYn eq 'N'}" class="join-btn" readonly >
                                    <label for="mngrYn1" class="btn btn-outline-purple w100p"
                                           data-toggle-class="btn-primary"
                                           data-toggle-passive-class="btn-default">사용자</label>
                                    <input type="radio" id="mngrYn2" name="mngrYn" value="Y" th:checked="${targetDto.mngrYn eq 'Y'}" class="join-btn" readonly>
                                    <label for="mngrYn2" class="btn btn-outline-purple w100p"
                                           data-toggle-class="btn-primary"
                                           data-toggle-passive-class="btn-default">관리자</label>
                                </div>
                            </div>
                            <div class="col-md-2 col-sm-4 ml_20p" th:if="${userRoleModDto != null}">
                                <select class="form-control" name="roleSn" id="roleList" style="display: none;">
                                    <option value="">관리자 권한 선택</option>
                                    <option th:each="item : ${roleList}" th:value="${item.roleSn}" th:text="${item.roleDc}" th:selected="${item.roleSn} == ${userRoleModDto.roleSn}">
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="field item form-group" id="userChldrnAddDiv">
                            <label class="col-form-label col-md-2 col-sm-3 label-align">자녀</label>
                            <div class="div_menu_detail row col-md-10">
                                <div class="col-md-12 col-sm-12 ">
                                    <div class="x_panel mb-0" style="height:auto;overflow: scroll; max-height:350px;">
                                        <div class="x_content mt_5p">
                                            <button type="button" class="btn btn-purple w100p mb_15p"
                                                    data-toggle="modal" data-target=".bs-example-modal-lg"
                                                    onclick="setModalBtn('C')">
                                                자녀 추가
                                            </button>
                                            <!-- 자녀 등록 모달 -->
                                            <div class="modal fade bs-example-modal-lg" tabindex="-1" role="dialog"
                                                 id="addChldrnModal"
                                                 aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
                                                <div class="modal-dialog modal-dialog-centered modal-lg">
                                                    <div class="modal-content">
                                                        <div class="modal-header">
                                                            <h4 class="modal-title">자녀 추가</h4>
                                                            <button type="button" class="close" data-dismiss="modal">
                                                                <span aria-hidden="true">×</span></button>
                                                        </div>
                                                        <div class="modal-body" id="addChldrnModalBody">
                                                        	<div name="chldrnModDiv" class="modForm" style="display: none;">
                                                                <!-- 자녀 수정시 여기서 수정 작업 -->
                                                            </div>
                                                            <div name="chldrnAddDiv" 
                                                            	th:replace="~{admin/user/modChldrnForm :: chldrnDiv(${targetChldrnDtoList}) }"
                                                            ></div>
                                                            <div name="chldrnAddDiv" class="newForm"
                                                                 th:insert="/admin/user/addChldrnForm.html">
                                                                <!-- 자녀 수정 모달 (/admin/user/addChldrnForm.html) -->
                                                            </div>
                                                        </div>
                                                        <div class="modal-footer">
                                                            <button type="button" class="btn btn-white"
                                                                    data-dismiss="modal">닫기
                                                            </button>
                                                            <button type="button" class="btn btn-purple"
                                                                    id="addChldrnBtn" onclick="addChldrn()">저장
                                                            </button>
                                                            <button type="button" class="btn btn-success"
                                                                    id="updateChldrnBtn" onclick="updateChldrn()"
                                                                    style="display:none;">수정
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <table class="table table-bordered text-center" id="chldrnTable">
                                                <thead>
                                                <tr>
                                                    <th>순번</th>
                                                    <th>이름</th>
                                                    <th>성별</th>
                                                    <th>생년월일</th>
                                                    <th>연락처</th>
                                                    <th>이메일</th>
                                                    <th>관리</th>
                                                </tr>
                                                </thead>
                                                <tbody id="chldrnTableBody">
                                                <!-- 자녀 추가 테이블 -->
                                                	<tr th:if = "${!targetChldrnDtoList.isEmpty()}" th:each=" data : ${targetChldrnDtoList} ">
						                                <td name="trNum" th:text="${dataStat.count}"></td>
						                                <td name="chldrnNm" th:text="${data.chldrnNm}"></td>
						                                <td name="chldrnGenderRadio" th:text="${data.chldrnGender}"></td>
						                                <td name="chldrnBrdtDate" th:text="${data.chldrnBrdtDate}"></td>
						                                <td name="chldrnTelNo" th:text="${data.chldrnTelNo}"></td>
						                                <td name="chldrnEmail" th:text="${data.chldrnEmail}"></td>
						                                <td>
						                                	<button onclick="modifyChldrn(this)" type="button" class="btn btn-success btn-sm table-btn">수정</button><button onclick="deleteChldrn(this)" type="button" class="btn btn-danger btn-sm table-btn">삭제</button>
						                                </td>
						                            </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    <small class="font-gray-dark">회원등록 후에도 자녀 등록이 가능합니다.<b>회원조회 &gt; 회원 우측
                                        [수정]</b></small>
                                </div>
                            </div>
                        </div>
                        <div class="ln_solid"></div>
                        <!-- 저장버튼 -->
                        <div class="col-md-12">
                            <!-- bottom left area -->
                            <div class="col-md-2 col-sm-3 text-left">
                                <a th:href="@{ {basicPath}/{mcd}/list ( basicPath = ${basicPath}, mcd = ${mcd} ) }" class="btn btn-white w120p">목록</a>
                            </div>
                            <!-- bottom center area -->
                            <div class="col-md-8 col-sm-6 text-center">
                                <a th:href="@{ {basicPath}/{mcd}/list ( basicPath = ${basicPath}, mcd = ${mcd} ) }" class="btn btn-white w120p">취소</a>
                                <button type="submit" class="btn btn-purple w120p">저장</button>
                            </div>
                            <!-- bottom right area -->
                            <div class="col-md-2 col-sm-3 text-right">
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- E : content -->
</th:block>
</html>
