<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{pon/layout/layout_main}">
<head layout:fragment="head">
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<!-- Meta, title, CSS, favicons, etc. -->
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">

	<title layout:fragment="title">피오니키즈</title>

	<!-- css -->
	<link rel="stylesheet" href="/pon/common/css/reset.css">
	<link rel="stylesheet" href="/pon/common/css/common.css">
	<link rel="stylesheet" href="/pon/common/css/style.css">
	<link rel="stylesheet" href="/pon/npm/swiper11/css/swiper-bundle.min.css">

</head>
<title layout:fragment="title">피오니키즈 - pioneerkids</title>

<!-- S : Javascript functions	-->
<div layout:fragment="script">
	<!-- js -->
	<script src="/pon/common/js/main.js"></script>
	<!-- popup -->
	<script src="/pon/common/js/popup.js"></script>
	
	<script>
		
		// ------------- function () 함수 실행  호출시점 : DOM Tree 생성 완료 후 -----------------
		$( function () {
			
			// popupList 불러와 팝업 호출
			showPopup();
			
		});
		
	</script>
</div>
<!-- E : Javascript functions	-->


<div class="wrap" layout:fragment="content">

	<!-- S : 메인 > 상단 배너 영역 -->
	<section class=" visual_sec">
		<div class="swiper mySwiper visual_swiper">
			<div class="swiper-wrapper">
				<!-- Dynamic Connection -->
				<div th:each="data : ${bannerTopList}" class="swiper-slide">
					<div class="visual_box">
						<div class="visual_img">
							<img th:src="@{/getImage(atchFileSn=${data.atchFileSn})}" th:alt="${data.bannerNm}">
						</div>
					</div>
				</div>
			</div>
			<div class="swiper-button-next"></div>
			<div class="swiper-button-prev"></div>
			<div class="swiper-pagination"></div>
		</div>
	</section>
	<!-- E : 메인 > 상단 배너 영역 -->

	<!-- S : 메인 > 클래스 카테고리 영역 -->
	<section th:each="data : ${bannerClDetailList}" th:classappend="|sec sec0${dataStat.count}|">
		<div th:classappend="|sec0${dataStat.count}_wrap|">
			<div th:classappend="|sec_txt sec0${dataStat.count}_txt|">
				<h3 th:text="${data.cdDetailNm}"></h3>
				<span th:text="${data.cdDetailVal2}"></span>
			</div>
			<div class="card_box">
				<div th:classappend="|swiper mySwiper sec0${dataStat.count}_swiper swiper|">
					<div class="swiper-wrapper">
						<div th:each="class : ${bannerClassList}" th:if="${class.bannerClDetailCd == data.cdDetailVal1}"
							 class="swiper-slide card_item" th:data-class-sn="${class.classSn}">
							<div class="item_img">
								<img th:src="@{/getImage(atchFileSn=${class.classThumbAtchFileSn})}" alt="" onclick="detailClass(this);">
							</div>
							<div class="item_info" onclick="detailClass(this);">
								<span th:text="${class.ctgryNm}" class="item_txt">카테고리명</span>
								<p th:text="${class.classSj}"/>
								<span th:if="${class.classDscntBfeAmt ne null && class.classDscntBfeAmt ne '' }" th:text="|${#numbers.formatInteger(class.classDscntBfeAmt, 3, 'COMMA')} 원|" class="item_sale"/>
								<span th:text="|${#numbers.formatInteger(class.classAmt, 3, 'COMMA')} 원|" class="item_price"/>
							</div>
						</div>
					</div>
				</div>
				<div class="swiper-button-next"></div>
				<div class="swiper-button-prev"></div>
			</div>
			<div class="sec_bg"></div>
		</div>
	</section>
	<!-- E : 메인 > 클래스 카테고리 영역 -->

	<!-- S : 메인 > 왜 피오니 키즈... -->
	<section class="sec sec05">
		<div class="sec05_wrap">
			<div class="sec05_box">
				<div class="sec05_left">
					<div class="sec05_left_box">
						<h3>왜 피오니키즈일까요?</h3>
						<div>
							<div class="book_n_ico">
								<img src="/pon/common/image/book_one.svg" alt="">
							</div>
							<p>미국 교과과정을 현지 선생님과 함께하는 <br>
							   미국형 온라인 홈스쿨링랩이니까!
							</p>
						</div>
						<div>
							<div class="book_n_ico">
								<img src="/pon/common/image/book_two.svg" alt="">
							</div>
							<p>미래형 개척자로서 성장할 수 있도록 영양 가득한 <br>
							   교육을 제공하니까!
							</p>
						</div>
						<div>
							<div class="book_n_ico">
								<img src="/pon/common/image/book_thr.svg" alt="">
							</div>
							<p>배움의 즐거움을 일깨워주는 기회를 제공하니까!</p>
						</div>
					</div>
					<div class="sec05_ico sec05_ico1">
						<img src="/pon/common/image/book_3d.png" alt="">
					</div>
					<div class="sec05_ico sec05_ico2">
						<img src="/pon/common/image/sec_ico_bu.svg" alt="">
					</div>
				</div>
				<div class="sec05_right">
					<img src="/pon/common/image/sec05_img.png" alt="">
				</div>
			</div>
		</div>
		<div class="sec05_bg">
			<img src="/pon/common/image/sec05_bg.png" alt="">
		</div>
	</section>
	<!-- E : 메인 > 왜 피오니 키즈... -->

	<!-- S : 메인 > 하단 디자인 -->
	<section class="sec sec07">
		<img class="sec07_bg_pc" src="/pon/common/image/sec07_bg.png" alt="">
		<img class="sec07_bg_mb" src="/pon/common/image/mb_sec07_bg.png" alt="">
		<div class="sec07_info">
			<h1>세상에 없던 우리 아이를 위한 맞춤수업 <strong>PIONEER KIDS</strong></h1>
		</div>
	</section>
	<!-- S : 메인 > 하단 디자인 -->

</div>

</html>
