<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{pon/layout/layout_mypage}">

<head layout:fragment="head">
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<!-- Meta, title, CSS, favicons, etc. -->
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">

	<title layout:fragment="title">피오니키즈</title>

</head>
<title layout:fragment="title">피오니키즈 - pioneerkids</title>
<!-- S : Javascript functions	-->
<div layout:fragment="script">
		<!-- js -->
	<script>
		function addMyChldrn(){
			/* TODO : 추가작업 */	
		}

	</script>
</div>

<!-- E : Javascript functions	-->
<div layout:fragment="content" class="sub_box mypage_contents">
	<!-- S: content -->
	
	<!-- S: 자녀 리스트 영역 -->
	<div class="myChldrnList">
		<ul>
			<li th:onclick="|myChildInfo('${item.userChldrnSeq}')|" th:each="item : ${userChldrnListDto}" th:text="${item.chldrnNm}"></li>
			<li onclick="addMyChldrn();">추가</li>
		</ul>
	</div>
	<!-- E: 자녀 리스트 영역 -->
	
	<!-- S: 자녀 수정 영역 -->
	<div name="chldrnModDiv" class="modForm" th:style=" ${type eq 'add'} ? 'display:none;' " >
		<input type="hidden" name="chldrnGender" />
		<div class="filebox preview-image">
			<div class="upload-display">
				<div class="upload-thumb-wrap">
					<img name="thumbSrc" alt="프로필 이미지" class="upload-thumb noimg">
				</div>
			</div>
			<div class="upload-btn mt_10p" style="margin-bottom: 13px;">
				<label class="btn btn-purple" >업로드
					<input type="file" name="file" class="upload-hidden" accept=".gif, .jpg, .jpeg, .png" style="display: none;" onchange="fileChange(this)">
				</label>
				<div class="upload-file-name" style="display: inline-block;">
					<input class="input-file-name" value="선택된 파일 없음(.gif, .jpg, .png)" disabled="disabled">
				</div>
			</div>
		</div>
		<div class="data-field">
			<span>이름</span>
			<input type="text" name="chldrnNm" placeholder="이름">
		</div>
		<div class="data-field">
			<span>생년월일</span>
			<input type="text" name="chldrnNm" placeholder="이름">
		</div>
		<div class="data-field">
			<span>연락처</span>
			<input type="text" name="chldrnNm" placeholder="이름">
		</div>
		<div class="data-field">
			<span>이메일</span>
			<input type="text" name="chldrnNm" placeholder="이름">
		</div>
		<div class="btn-group radiobox">
			<label	class="l4px btn btn-outline-purple w100p"
					data-toggle-class="btn-primary"
					data-toggle-passive-class="btn-default">
			<input type="radio" name="chldrnGenderRadio" value="M" class="join-btn chldrnGenderRadio" onclick="clickRadioEvent(this)"> 남자
			</label>
			<label	class="r4px btn btn-outline-purple w100p"
					data-toggle-class="btn-primary"
					data-toggle-passive-class="btn-default">
			<input type="radio" name="chldrnGenderRadio" value="F" class="join-btn chldrnGenderRadio" onclick="clickRadioEvent(this)">여자
			</label>
		</div>
		<input type="text"	name="chldrnBrdtDate"	placeholder="생년월일 ( YYYYMMDD ex)20130119" maxlength="8">
		<input type="tel"	name="chldrnTelNo"		placeholder="연락처"	data-validate-length-range="10,11"	maxlength="11"	>
		<input type="text"	name="chldrnEmail"		placeholder="이메일" >
	</div>
	<!-- E: 자녀 수정 영역 -->
	
	<!-- S: 자녀 등록 영역 -->
	<div name="chldrnAddDiv" class="newForm" th:style=" ${type eq 'mod' || type eq null } ? 'display:none;' " >
		<input type="hidden" name="chldrnGender" />
		<div class="filebox preview-image">
			<div class="upload-display">
				<div class="upload-thumb-wrap">
					<img name="thumbSrc" alt="프로필 이미지" class="upload-thumb noimg">
				</div>
			</div>
			<div class="upload-btn mt_10p" style="margin-bottom: 13px;">
				<label class="btn btn-purple" >업로드
					<input type="file" name="file" class="upload-hidden" accept=".gif, .jpg, .jpeg, .png" style="display: none;" onchange="fileChange(this)">
				</label>
				<div class="upload-file-name" style="display: inline-block;">
					<input class="input-file-name" value="선택된 파일 없음(.gif, .jpg, .png)" disabled="disabled">
				</div>
			</div>
		</div>
		<div class="data-field">
			<span>이름</span>
			<input type="text" name="chldrnNm" placeholder="이름">
		</div>
		<div class="data-field">
			<span>생년월일</span>
			<input type="text" name="chldrnNm" placeholder="이름">
		</div>
		<div class="data-field">
			<span>연락처</span>
			<input type="text" name="chldrnNm" placeholder="이름">
		</div>
		<div class="data-field">
			<span>이메일</span>
			<input type="text" name="chldrnNm" placeholder="이름">
		</div>
		<div class="btn-group radiobox">
			<label	class="l4px btn btn-outline-purple w100p"
					data-toggle-class="btn-primary"
					data-toggle-passive-class="btn-default">
			<input type="radio" name="chldrnGenderRadio" value="M" class="join-btn chldrnGenderRadio" onclick="clickRadioEvent(this)"> 남자
			</label>
			<label	class="r4px btn btn-outline-purple w100p"
					data-toggle-class="btn-primary"
					data-toggle-passive-class="btn-default">
			<input type="radio" name="chldrnGenderRadio" value="F" class="join-btn chldrnGenderRadio" onclick="clickRadioEvent(this)">여자
			</label>
		</div>
	</div>
	<!-- E: 자녀 수정 영역 -->
	
	<!-- E: content -->
</div>

</html>
