<div class="pop_wrap join" data-layer-wrap="join" >
	<div class="pop_top">
		<button class="pop_close hide_pop" data-layer-id="join" >
			<img src="/pon/common/image/chat_close.svg" alt="">
		</button>
	</div>
	<div class="pop_header">
		<img src="/pon/common/image/logo.svg" alt="피오니키즈 로고">
		<h2 class="pop_title">회원가입</h2>
	</div>
	<div class="pop_content">
		<div class="join_wrap">
			<div class="filebox preview-image">
				<div class="upload-display">
					<div class="upload-thumb-wrap">
						<img alt="프로필 이미지" class="upload-thumb noimg">
					</div>
				</div>
				
				<div class="upload-file-name">
					<input class="input-file-name" value="선택된 파일 없음(.gif, .jpg, .png)" disabled="disabled">
				</div><div class="upload-btn mt_10p">
					<label class="btn btn-purple">업로드
						<input type="file" name="file" class="upload-hidden" accept=".gif, .jpg, .png" style="display: none;" onchange="fileChange(this)">
					</label>
				</div>
			</div>
			<input tyle="text" name="userNm" placeholder="이름" >
			<div class="btn-group radiobox">
				<input type="radio" id="gender1" name="gender" value="M" class="join-btn" required="">
				<label for="gender1" class="btn btnFirst w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">남자</label>
				<input type="radio" id="gender2" name="gender" value="F" class="join-btn" required="">
				<label for="gender2" class="btn btnLast w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">여자</label>
			</div>
			<input tyle="text" name="userNm" placeholder="이메일 (로그인 id, 비밀번호 찾기 시 이메일로 메일이 전송됩니다.)" >
			<input tyle="text" name="userNm" placeholder="비밀번호" >
			<input tyle="text" name="userNm" placeholder="비밀번호 재입력" >
			<input tyle="text" name="userNm" placeholder="생년월일 (숫자8자리로 입력해주세요. YYYYMMDD ex)19930119 " >
			<div class="btn-group radiobox">
				<input type="radio" id="resideArea1" name="resideArea" value="대한민국" class="join-btn" required="">
				<label for="resideArea1" class="btn btnFirst w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">대한민국</label>
				<input type="radio" id="resideArea2" name="resideArea" value="other" class="join-btn" required="">
				<label for="resideArea2" class="btn btnLast w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">그 외</label>
			</div>
			<input tyle="text" name="userNm" placeholder="연락처" >
			
		</div>
	</div>
</div>
