<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
	$( function () {

		$("#join_countryList").change(function(){
			var value = $(this).val();
			
			if ( value == '' ) {
				$("#join_countryList").removeClass("choiced");
				
			} else {
				$("#join_countryList").addClass("choiced");
			}
		});
		
		// 거주지역 그 외만 선택 했을 시 return false;
		var resideArea = $( "#userInsertForm input:radio[name='resideArea']:checked" ).val();
		var country = $("#join_countryList option:selected").val();
		if ( resideArea == 'other' ) {
			if ( country == '' ) {
				alert( "거주지역을 선택해주세요." );
				$( "#join_countryList" ).focus();
				return false;
			} else {
				$( "[name='resideArea']" ).val( country );
			}
		}
		
		
		
		// 거주지역 변동시 셀렉트박스 표출 처리
		$( "#userInsertForm input:radio[name='resideArea']" ).change( function () {

			// 그 외 거주지역 선택시 나라 선택하도록 setting
			var country = $( this ).val();

			if ( country == 'other' ) {
				// 그 외 국가로 했을시
				$( "#join_countryList" ).show();
				$( "#join_addressWrap" ).hide();
			} else {
				// 대한민국으로 했을시
				$( "#join_addressWrap" ).show();
				$( "#join_countryList" ).hide();
			}
		} );


		// 주소 검색 버튼 클릭 event
		$("#findAddressBtn").click( function(){

			// 다음 주소 api 연동
			new daum.Postcode({
				oncomplete: function( data ) {

					// 상세주소 초기화
					$( "[name='detailAddress']" ).val( "" );										// 상세주소 초기화

					// 주소 정보 setting

					$( "[name='zonecode']" ).val( data.zonecode );									// 우편번호
					$( "[name='roadAddress']" ).val( data.roadAddress );							// 도로명주소
					$( "[name='roadAddressEnglish']" ).val( data.roadAddressEnglish );				// 영문도로명주소
					$( "[name='jibunAddress']" ).val( data.jibunAddress );							// 지번주소
					$( "[name='jibunAddressEnglish']" ).val( data.jibunAddressEnglish );			// 영문지번주소
					$( "[name='autoRoadAddress']" ).val( data.autoRoadAddress );					// 자동도로명주소
					$( "[name='autoRoadAddressEnglish']" ).val( data.autoRoadAddressEnglish );		// 자동영문도로명주소
					$( "[name='autoJibunAddress']" ).val( data.autoJibunAddress );					// 자동지번주소
					$( "[name='autoJibunAddressEnglish']" ).val( data.autoJibunAddressEnglish );	// 자동영문지번주소

				}
			}).open();

		})


	})
	
</script>
<div class="pop_wrap join" data-layer-wrap="join" >
	<div class="pop_top">
		<button type="button" class="pop_close hide_layer" data-layer-id="join" >
			<img src="/pon/common/image/chat_close.svg" alt="">
		</button>
	</div>
	<div class="pop_header">
		<img src="/pon/common/image/logo.svg" alt="피오니키즈 로고">
		<h2 class="pop_title">회원가입</h2>
	</div>
	<div class="pop_content">
		<div class="join_wrap">
			<input type="hidden" name="snsType" 	/>
			<input type="hidden" name="snsKakaoCntnYn" 	title="sns_kakao"	/>
			<input type="hidden" name="snsGoogleCntnYn"	title="sns_google" 	/>
			<!-- 주소 정보 항목 -->
			<input type="hidden" name="roadAddressEnglish"		title="영문도로명주소" value="" 	/>
			<input type="hidden" name="jibunAddress"			title="지번주소" value="" 	/>
			<input type="hidden" name="jibunAddressEnglish"		title="영문지번주소" value="" 	/>
			<input type="hidden" name="autoRoadAddress"			title="자동도로명주" value="" 	/>
			<input type="hidden" name="autoRoadAddressEnglish"	title="자동영문도로명주소" value="" 	/>
			<input type="hidden" name="autoJibunAddress"		title="자동지번주소" value="" 	/>
			<input type="hidden" name="autoJibunAddressEnglish"	title="자동영문지번주소" value="" 	/>


			<div class="filebox preview-image">
				<div class=	"upload-display">
					<div class="upload-thumb-wrap" style="max-width:100%;">
						<img alt="프로필 이미지" class="upload-thumb noimg">
					</div>
				</div>
				<div class="upload-file-name">
				</div><div class="upload-btn mt_10p" style="margin-bottom: 13px;">
					<label class="btn btn-purple" >업로드
						<input type="file" name="file" class="upload-hidden" accept=".gif, .jpg, .jpeg, .png" style="display: none;" onchange="fileChange(this)">
					</label><div class="upload-file-name" style="display: inline-block;">
					<input class="input-file-name" value="선택된 파일 없음(.gif, .jpg, .png)" disabled="disabled">
				</div>
				</div>
			</div>
			<div class="data-field" >
				<span class="info" >ID</span>
			</div>
			<div class="data-field" >
				<input type="text" name="userId" class="form-control first" placeholder="ID (이메일 형태. 계정 찾기 시 이메일로 인증메일 발송)" required="required"
					   th:readonly="${lgStatus != null && lgStatus == 'joinForSns'} ? 'readonly'" th:value="${snsUserId}" th:title="${lgStatus}">
				<div class="input_comment">
					<span id="checkResult"></span>
				</div>
			</div>
			<div id="joinForSnsTypeArea" style="display:none;">
				<div class="data-field" >
					<span class="info" >SNS연동 회원가입</span>
				</div>
				<div class="data-field" >
					<select name="joinForSnsType" class="selectbox displaySnsType" id="joinForSnsType" style="display:none;">
						<option value=''>SNS연동 회원가입</option>
						<option th:each="item : ${loginSnsTypeList}" th:value="${item.cdDetailVal1}" th:text="${item.cdDetailVal2}">
					</select>
				</div>
			</div>
			<div class="data-field" >
				<span class="info" >비밀번호</span>
			</div>
			<div class="data-field" >
				<input type="password" id="password1" name="password" class="form-control" placeholder="비밀번호 (영문, 숫자, 특수문자를 포함 최소8자리)" required="required" autocomplete="off" >
			</div>
			<div class="data-field" >
				<span class="info" >비밀번호 확인</span>
			</div>
			<div class="data-field" >
				<input type="password" name="password2" class="form-control" data-validate-linked='password' required='required' placeholder="비밀번호 재입력" onchange="checkPasswordMatching();" autocomplete="off" >
				<div class="input_comment">
					<span id="passwordMatchingResult"></span>
				</div>
			</div>
			<div class="data-field" >
				<span class="info" >이름</span>
			</div>
			<div class="data-field" >
				<input type="text" name="userNm" placeholder="이름">
			</div>
			<div class="data-field" >
				<span class="info" >성별</span>
			</div>
			<div class="data-field btn-group radiobox" >
				<label	class="l4px btn btn-outline-purple w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">
					<input type="radio" name="gender" value="M" class="join-btn gender" onclick="clickRadioEvent(this)" > 남자
				</label>
				<label	class="r4px btn btn-outline-purple w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">
					<input type="radio" name="gender" value="F" class="join-btn gender" onclick="clickRadioEvent(this)" >여자
				</label>
			</div>
			<div class="data-field" >
				<span class="info" >연락처</span>
			</div>
			<div class="data-field" >
				<input type="text" class="last" name="telNo" placeholder="연락처(ex ) 01000000000 )" >
			</div>
			<div class="data-field" >
				<span class="info" >생년월일</span>
			</div>
			<div class="data-field" >
				<input type="text" name="brdtDate" placeholder="생년월일 ( ex)19930101 )">
			</div>
			<div class="data-field" >
				<span class="info" >거주지역</span>
			</div>
			<div class="data-field btn-group radiobox mb_5p" >
				<label	class="l4px btn btn-outline-purple w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">
					<input type="radio" name="resideArea" value="대한민국" class="join-btn" onclick="clickRadioEvent(this)" > 대한민국
				</label>
				<label	class="r4px btn btn-outline-purple w100p" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default" >
					<input type="radio" name="resideArea" value="other" class="join-btn" onclick="clickRadioEvent(this)" >그 외
				</label>
			</div>
			<div class="data-field" id="join_addressWrap" style="display: none;" >
				<input type="text" name="zonecode" placeholder="우편번호" readonly="readonly" style="width:145px; min-width: 145px;" >
				<label class="btn btn-purple" id="findAddressBtn">주소검색</label>
				<input type="text" name="roadAddress" placeholder="주소(도로명)" readonly="readonly" >
				<input type="text" name="detailAddress" placeholder="주소 상세">
			</div>
			<select name="otherResideArea" class="selectbox" id="join_countryList" style="display:none;">
				<option value=''>국가선택</option>
				<option th:each="item : ${resideAreaList}" th:value="${item.cdDetailVal1}" th:text="${item.cdDetailNm}">
			</select>
		</div>
		<div class="join_chldrn_title_wrap" >
			<div class="sub_title">자녀 정보</div>	
		</div>
		<div class="addChldrnData"></div>
		<div class="join_wrap add_chldrn">
			<div class="chldrn_list" id="chldrnTableBody">
			</div>
			<div class="plus-chldrn-btn">
				<img class="plus_chldrn_btn" src="/pon/common/image/plus_icon.png" data-layer-id="addChldrn" alt="자녀 추가" onclick="setModalBtn('C')" >
			</div> 
		</div>
	</div>
	<div class="pop_footer join_pop">
		<div class="join_agree_wrap">
			<input id="agreeUseofTermsCb" type="checkbox" name="agreeUseofTerms" value="Y" required="required">
    		<label for="agreeUseofTermsCb"></label>
    		<span class="cbTitle show_layer_lv2" data-layer-id="termsOfUse">[필수] 피오니키즈 이용약관에 동의합니다.</span>
		</div>
		<div class="join_agree_wrap">
			<input id="agreePersonalInfoCb" type="checkbox" name="agreePersonalInfo" value="Y"  required="required" >
    		<label for="agreePersonalInfoCb"></label>
    		<span class="cbTitle show_layer_lv2" data-layer-id="personalInfo">[필수] 피오니키즈 개인정보 처리방침에 동의합니다.</span>
		</div>
		<label class="btn btn-purple" onclick="return userInsert();">
			회원가입
		</label>
	</div>
</div>
