<div class="pop_wrap login" data-layer-wrap="login" >
	<div class="pop_top">
		<button class="pop_close hide_pop" data-layer-id="login" >
			<img src="/pon/common/image/chat_close.svg" alt="">
		</button>
	</div>
	<div class="pop_header">
		<img src="/pon/common/image/logo.svg" alt="피오니키즈 로고">
		<h2 class="pop_title">계정통합</h2>
	</div>
	<div class="pop_content">
		<form  id="userIntegratedForm" name="userIntegratedForm" method="POST"   th:action="@{ /login }" onsubmit="return readyLogin('default');">
			<div class="login_wrap integrated_wrap">
				<div class="default_login_wrap">
					<div class="input_wrap">
						<input type="hidden"	name="returnUrlAfterLoginFail"	value="/"	/>
						<input type="hidden"	name="returnUrlAfterLogin"		value="/"	/>
						<input type="text" 		name="username" placeholder="이메일" th:value="${integratedUser != null } ? ${integratedUser.userId}" readonly="readonly">
						<input type="password"  name="password" placeholder="비밀번호 입력 후 계정 통합을 진행해주세요." autocomplete="off" >
					</div>
				</div>
				<div class="or"></div>
				<div class="agree_wrap">
					<div class="join_agree_wrap">
						<div class="agree-cb-box">
							<input id="agreeUserIntegrated_Y" type="checkbox" name="agreeUserIntegrated" value="Y">
							<label for="agreeUserIntegrated_Y"></label>
						</div>
						<div class="agree-title">
							<span class="cbTitle show_pop_lv2">[필수] SNS(구글)을 통해 피오니키즈의 시스템에 로그인하는 것을 기존 피오니키즈 계정과 통합하여 로그인을 이용하는 것에 동의합니다.</span>
						</div>
					</div>
					<label class="btn btn-purple" onclick="return userIntegrated();">
						계정통합하기
					</label>
				</div>
			</div>
		</form>
	</div>
	<div class="pop_footer userIntegrated">
		<div class="user_wrap">
			<a href="javascript:void(0);" class="show_pop" data-layer-id="findUser">아이디 &middot; 비밀번호 찾기</a>
		</div>
	</div>

</div>
